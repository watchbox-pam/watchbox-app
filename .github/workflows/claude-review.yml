name: Claude PR Review

on:
  pull_request:
    # Uniquement les PR qui ciblent main ou develop
    branches: [main, develop]
    # opened / ready_for_review : première review
    # synchronize (nouveau push) : re-review + vérification des corrections
    types: [opened, synchronize, ready_for_review]
    # Ne lance pas de review si la PR ne touche que ces fichiers
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.woff'
      - '**/*.woff2'

# Un nouveau push annule la review en cours de la même PR : la suivante relit
# tout le diff, donc rien n'est perdu.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Ignore les brouillons et les PR des bots (Dependabot, Renovate...)
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # Le checkout sert à faire des Grep / lire des fichiers du projet.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review par Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Abonnement Pro/Max : token généré avec `claude setup-token`.
          # Attention : consomme les quotas de la personne qui l'a généré.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ou, avec une clé API à la place :
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Fais une review de cette pull request du FRONT de Watchbox
            (React Native 0.83 avec Fabric activé, Expo SDK 55 + expo-router,
            Reanimated 4.2.1, Zustand, TypeScript strict, Firebase Analytics).
            Réponds en français.

            ## Ce qu'il faut relire
            - Lis le diff complet de la PR : `gh pr diff ${{ github.event.pull_request.number }}`.
              Ce diff ne contient que les changements de la PR, même si
              `develop` a été mergé dans la branche entre-temps.
            - Si EVENT vaut "synchronize" (nouveau push) :
              1. Lis d'abord tes commentaires précédents :
                 `gh pr view ${{ github.event.pull_request.number }} --comments`
                 et `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              2. Vérifie si les problèmes déjà signalés sont corrigés.
              3. Ne reposte pas en inline une remarque déjà faite :
                 mentionne-la seulement dans la synthèse.

            ## Méthode (pour rester économe)
            - Base-toi d'abord sur le diff.
            - N'ouvre un fichier complet que si le diff ne suffit pas à comprendre.
            - Pour vérifier les impacts, utilise Grep pour trouver où le code
              modifié est utilisé, sans lire tout le projet.

            ## Règles de fiabilité
            - Tu ne peux pas exécuter l'app. Ne marque un problème "bloquant"
              que si tu peux montrer le chemin exact qui casse (fichier, ligne,
              écran concerné). Sinon, classe-le "à vérifier" et explique ce
              qu'il faudrait tester.
            - N'utilise pas "potentiellement" pour un bloquant.
            - Pour chaque composant, fonction, export ou route expo-router
              SUPPRIMÉ ou RENOMMÉ, cherche avec Grep s'il est encore importé.
            - Tu n'as pas accès au back. Si la PR appelle une route API
              nouvelle ou modifiée, signale-la en "à vérifier" en précisant
              qu'elle doit exister côté watchbox-back.
            - La dette connue (liste plus bas) n'est pas à signaler, sauf si la
              PR la reproduit dans du code nouveau ou l'aggrave.

            ## Pièges connus de ce projet (à vérifier en priorité)
            - Jamais `<Image source={{ uri }} />` avec un `uri` qui peut être
              null/undefined : crash natif silencieux sur Fabric. Rendu
              conditionnel obligatoire, ou `src/components/FallbackImage.tsx`.
            - Reanimated 4 : pas de fonction `Easing.*` dans un `withTiming`
              imbriqué dans `withRepeat` / `withDelay` / `withSequence`.
              `withSpring` n'accepte ni `duration` ni `easing`.
            - `ApiHelper` (`src/utils/axios.ts`) ne lève pas d'erreur : il renvoie
              `{ success, data }`. En échec, `data` est déjà une string : lire
              `result.data`, jamais `result.data.detail`. (`post`/`patch`
              renvoient le detail du back, `get`/`put`/`delete` le message axios.)
            - Erreurs Axios : toujours
              `error.response?.data?.detail ?? error.message ?? "Unknown error"`,
              jamais `error.response.data` en accès direct.
            - Appels API via un service de `src/services/`, jamais axios
              directement dans un écran.
            - Doublon côté back (déjà dans la playlist) = HTTP 409 : toast
              `info`, pas une erreur.
            - Pas de `as any` / `: any` / `state: any` dans du code nouveau
              (seule exception : `router.push()` sur une route dynamique).
              Nom d'icône : `ComponentProps<typeof Icon>["name"]`.
            - Types partagés importés depuis leur service (ex. quiz : depuis
              `src/services/QuizService.ts`), pas redéfinis dans les écrans.
            - Styles : toujours `StyleSheet.create()`, dans `src/styles/`.
            - `expo-file-system` : importer depuis `expo-file-system/legacy`
              pour `cacheDirectory`.
            - Filtres de plateformes : uniquement via
              `src/zustand/filtersStore.ts`, pas de state local + SecureStore.
            - Listes de longueur variable : `FlatList`, pas `ScrollView` + `map`.
            - Pas d'import circulaire (ex. `DropDownPlaylist` ne doit jamais
              importer `MovieScreen`).
            - `src/app/(app)/_layout.tsx` doit rester un `Stack`.
            - Android : pas de `setBehaviorAsync` / `setPositionAsync`
              (non supportés en edge-to-edge).
            - Ne doit jamais être commité : un `.env` / `.env.example` avec une
              IP locale (`EXPO_PUBLIC_BASE_API_URL` en 192.168.x / 10.x), ni
              l'import Firebase commenté dans `src/services/analytics.ts` ou
              `src/services/firebase-test.ts`. (Le hook husky fait
              `git add -A .` : ces fichiers partent facilement par accident.)

            ## Dette connue (ne pas signaler si la PR n'y touche pas)
            - Le `catch` de `ApiHelper.post` lit `error.response.data.detail`
              en accès direct.
            - ~17 `as any` et ~57 `: any` existants.

            ## Points à vérifier
            - les pièges connus ci-dessus (en priorité)
            - les bugs et erreurs de logique (états React, effets, appels API)
            - la sécurité (token, données sensibles en clair, fichiers à ne
              jamais commiter)
            - la performance (re-renders, appels API en boucle, listes non virtualisées)
            - les autres écrans/composants qui utilisent le code modifié

            ## Format de réponse
            - Commentaires inline uniquement sur les vrais problèmes, avec la
              correction proposée.
            - Pas de commentaire sur ce qui est correct, pas de compliments,
              pas de remarques de style mineures.
            - Termine par UNE synthèse courte, qui commence exactement par
              "## Synthèse Claude" :
              - verdict (OK / à corriger)
              - les bloquants (prouvés) puis les "à vérifier"
              - pour un nouveau push : ce qui a été corrigé et ce qui reste à corriger
            - Publie-la en mettant à jour ta synthèse précédente au lieu d'en
              créer une nouvelle :
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<synthèse>"`

          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Grep,Glob,Read"